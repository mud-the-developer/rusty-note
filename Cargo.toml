[package]
name = "rusty-note"
version = "1.0.0"
edition = "2024"
description = "Native Windows Markdown sticky notes with cached Pretext layout"
license = "MIT"
repository = "https://github.com/mud-the-developer/rusty-note"
rust-version = "1.99"

[dependencies]
gpui-pretext = "=0.6.2"
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "=23.0.0"
# Parser only: never call upstream layout/render (non-DirectWrite metrics).
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
regex = "1.12"
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_Graphics_Imaging", "Win32_Storage_FileSystem",
    "Win32_System_Threading", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_System_Memory",
    "Win32_UI_Controls_RichEdit"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
