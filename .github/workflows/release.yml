name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Package portable Windows x64 release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          if ($version -ne "v$cargoVersion") { throw 'Version tag does not match Cargo.toml' }
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item target/release/rusty-note.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.txt out/package/
          Compress-Archive -Path out/package/* -DestinationPath "out/rusty-note-$version-windows-x64.zip"
          $hash = (Get-FileHash "out/rusty-note-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  rusty-note-$version-windows-x64.zip" | Set-Content "out/SHA256SUMS.txt" -Encoding ascii
      - name: Publish stable release or pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'
          $releaseFlags = @('--latest')
          if ($version -like 'v0.*' -or $version.Contains('-')) {
            $releaseFlags = @('--prerelease', '--latest=false')
          }
          gh release create $version out/*.zip out/SHA256SUMS.txt --title "Rusty Note $version" --generate-notes @releaseFlags
